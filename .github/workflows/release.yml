name: Release

run-name: Release ${{ inputs.package }} (${{ inputs.bump }})

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'What to release: a package of packages/ (neon_ui) or a theme file of themes/ (code)'
        type: string
        required: true
      bump:
        description: 'Version bump: major (0.2.0 → 1.0.0), minor (0.2.0 → 0.3.0) or patch (0.2.0 → 0.2.1)'
        type: choice
        required: true
        default: choose
        options:
          - choose
          - major
          - minor
          - patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: CI
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  release:
    name: Bump, tag and release
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: The new version
        id: version
        env:
          PACKAGE: ${{ inputs.package }}
          BUMP: ${{ inputs.bump }}
        run: |
          if [ -f "packages/$PACKAGE/pubspec.yaml" ]; then
            file="packages/$PACKAGE/pubspec.yaml"
            current="$(sed -n 's/^version: *//p' "$file")"
          elif [ -f "themes/$PACKAGE.version" ]; then
            file="themes/$PACKAGE.version"
            current="$(tr -d '[:space:]' < "$file")"
          else
            echo "::error::No package packages/$PACKAGE and no theme themes/$PACKAGE.yml"; exit 1
          fi
          IFS=. read -r major minor patch <<< "${current%%+*}"
          case "$BUMP" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="$major.$((minor + 1)).0" ;;
            patch) next="$major.$minor.$((patch + 1))" ;;
            *) echo "::error::Choose major, minor or patch"; exit 1 ;;
          esac
          tag="$PACKAGE-v$next"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::The tag $tag exists"; exit 1
          fi
          if [ "${file##*.}" = "version" ]; then
            echo "$next" > "$file"
          else
            sed -i "s/^version: .*/version: $next/" "$file"
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        env:
          PACKAGE: ${{ inputs.package }}
          NEXT: ${{ steps.version.outputs.next }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore(release): $PACKAGE $NEXT"
          git tag "$TAG"
          git push origin HEAD:main "$TAG"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ inputs.package }}
          NEXT: ${{ steps.version.outputs.next }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ -f "themes/$PACKAGE.version" ]; then
            notes="$(printf '%s\n' \
              'spring:' \
              '  flutter:' \
              '    theme:' \
              "      source: github:$GITHUB_REPOSITORY/themes/$PACKAGE.yml@$TAG")"
          else
            notes="$(printf '%s\n' \
              'dependencies:' \
              "  $PACKAGE:" \
              '    git:' \
              "      url: https://github.com/$GITHUB_REPOSITORY.git" \
              "      path: packages/$PACKAGE" \
              "      ref: $TAG")"
          fi
          gh release create "$TAG" --title "$PACKAGE $NEXT" --generate-notes \
            --notes "$(printf '```yaml\n%s\n```' "$notes")"
